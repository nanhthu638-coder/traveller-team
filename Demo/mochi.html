<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hồ Sơ Cá Nhân</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: #ddd; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .btn { display: inline-block; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Khu vực hiển thị Avatar -->
        <div class="avatar">👤</div>
        <h2>Nguyễn Văn A</h2>
        <p>Email: test@example.com</p>
        <p>Trạng thái: Đã đăng nhập</p>
        <a href="#" class="btn">Xem lịch sử đặt vé</a>
    </div>

</body>
</html>
